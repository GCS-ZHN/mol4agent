name: release

# Per-package releases on `main`. CI must pass first, then each package is
# published only when its own package.json version is not released yet.
# See "Versioning and releases" in AGENTS.md.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the release plan without publishing
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run runs from the default branch; release the commit CI
          # actually checked, not a newer main tip.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify a manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm typecheck
          pnpm --filter @gcszhn/mol4agent-core test
          pnpm --filter @gcszhn/mol4agent-deepseekharness test
          pnpm --filter @gcszhn/mol4agent-opencode test
          pnpm --filter @gcszhn/mol4agent-chatgpt build
          pnpm --filter @gcszhn/mol4agent-chatgpt test

      - name: Publish packages with new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node .github/scripts/release-packages.mjs
